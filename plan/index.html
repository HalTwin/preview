<style>
:root { color-scheme: dark; --bg: #0a0a15; --line: #26243f; --text: #ecebff; --dim: #9b98c6; --gold: #f5c542; --bad: #ff7a8a; --focus: #5ef2ff;
  --notch: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px); }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; display: grid; place-items: center; padding: 24px 16px; color: var(--text);
  background: radial-gradient(900px 520px at 50% -12%, #1b1840 0%, transparent 70%), var(--bg);
  font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
form { width: min(380px, 100%); display: grid; gap: 16px; padding: 30px 26px 24px; border: 1px solid var(--line); clip-path: var(--notch);
  background: linear-gradient(180deg, rgba(24, 22, 48, .9), rgba(12, 11, 26, .94)); }
.kicker { font: 800 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .32em; color: var(--gold); }
h1 { margin: -6px 0 0; font-size: 22px; letter-spacing: .06em; }
p { margin: 0; color: var(--dim); font-size: 14px; }
.field { display: grid; gap: 6px; font-size: 12px; letter-spacing: .12em; color: var(--dim); }
input[type="password"] { width: 100%; padding: 12px 14px; border: 1px solid var(--line); background: #07070f; color: var(--text);
  font: 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .06em; }
.remember { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--dim); cursor: pointer; }
.remember input { width: 16px; height: 16px; accent-color: var(--gold); }
button { height: 48px; border: 0; cursor: pointer; clip-path: var(--notch); color: #241603; font-weight: 900; font-size: 16px; letter-spacing: .16em;
  background: linear-gradient(180deg, #fff1b8 0%, var(--gold) 45%, #d99a1e 100%); box-shadow: inset 0 -3px 0 rgba(120, 70, 0, .45); }
button:disabled { cursor: progress; filter: saturate(.6) brightness(.85); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.status { min-height: 1.5em; font-size: 13px; color: var(--dim); }
.status.bad { color: var(--bad); }
</style>
</head>
<body>
<div style="display:none"><img src="../og-square.png" alt="" width="600" height="600"></div>
<form id="lock">
  <div class="kicker">INTERNAL</div>
  <h1>内部预览</h1>
  <p>这个页面只给团队成员看，请输入团队发给你的密码。</p>
  <label class="field" for="pw">密码
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
  </label>
  <label class="remember" for="remember"><input id="remember" type="checkbox"> 在这台设备上记住</label>
  <!-- Disabled until the script is ready: the form must never be submitted by the browser itself. -->
  <button id="go" type="submit" disabled>进入</button>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <noscript><p class="status bad">需要开启 JavaScript 才能打开这个页面。</p></noscript>
</form>
<script>
(() => {
  const P = {"iter":600000,"salt":"zmSQOkW5Qo7qYiVlQtYyhA==","iv":"Sli0hXt5NvOgVnLP","file":"data-779c7dfb66e1.bin","size":11169};
  const SAVED = 'preview-key:' + P.salt;
  const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const $ = (id) => document.getElementById(id);
  const say = (text, bad) => { $('status').textContent = text; $('status').className = bad ? 'status bad' : 'status'; };
  if (!window.crypto?.subtle || !('DecompressionStream' in window)) {
    say('这个浏览器太旧，打不开加密页面。请用最新版的 Chrome、Edge、Safari 或 Firefox。', true);
    return;
  }
  // Download the encrypted page while the password is being typed.
  const data = fetch(P.file).then((r) => {
    if (!r.ok) throw new Error(String(r.status));
    return r.arrayBuffer();
  });
  data.catch(() => { /* reported on submit */ });
  const NO_DATA = '页面数据没有下载下来，请检查网络后刷新再试。';
  $('go').disabled = false;
  async function derive(pass) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(P.salt), iterations: P.iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
  }
  // Throws when the key is wrong (AES-GCM checks the tag).
  async function decrypt(key, bin) {
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(P.iv) }, key, bin);
    return new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  }
  function show(html) {
    document.open();
    document.write(html);
    document.close();
  }
  async function fromSaved() {
    let saved = null;
    try { saved = localStorage.getItem(SAVED); } catch { return; }
    if (!saved) return;
    say('正在打开…');
    let bin;
    try { bin = await data; } catch { say(NO_DATA, true); return; }
    try {
      const key = await crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']);
      show(await decrypt(key, bin));
    } catch {
      say('');
      try { localStorage.removeItem(SAVED); } catch { /* storage unavailable */ }
    }
  }
  $('lock').addEventListener('submit', async (event) => {
    event.preventDefault();
    $('go').disabled = true;
    say('正在下载页面…');
    let bin;
    try { bin = await data; } catch {
      say(NO_DATA, true);
      $('go').disabled = false;
      return;
    }
    say('正在解锁…');
    let html;
    let key;
    try {
      key = await derive($('pw').value);
      html = await decrypt(key, bin);
    } catch {
      say('密码不对，请再试一次。', true);
      $('go').disabled = false;
      $('pw').select();
      return;
    }
    if ($('remember').checked) {
      try {
        const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
        localStorage.setItem(SAVED, btoa(String.fromCharCode(...raw)));
      } catch { /* not remembered; the page still opens */ }
    }
    show(html);
  });
  fromSaved();
})();
</script>
</body>
